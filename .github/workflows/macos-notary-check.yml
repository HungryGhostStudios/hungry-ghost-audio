name: Check Apple notarization credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - name: Validate notarization login in a disposable keychain
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, secrets, subprocess
          from pathlib import Path
          keys=['MACOS_APPLE_ID','MACOS_TEAM_ID','MACOS_NOTARY_PASSWORD']
          assert all(os.environ.get(k) for k in keys), 'Missing notarization credentials'
          keychain=Path(os.environ['RUNNER_TEMP'])/'notary-check.keychain-db'
          password=secrets.token_hex(24)
          def run(command):
              result=subprocess.run(command, capture_output=True)
              if result.returncode:
                  raise RuntimeError('Notarization credential check failed at '+Path(command[0]).name)
          try:
              run(['security','create-keychain','-p',password,str(keychain)])
              run(['security','unlock-keychain','-p',password,str(keychain)])
              run(['xcrun','notarytool','store-credentials','hungryghost-check',
                   '--apple-id',os.environ['MACOS_APPLE_ID'],'--team-id',os.environ['MACOS_TEAM_ID'],
                   '--password',os.environ['MACOS_NOTARY_PASSWORD'],'--keychain',str(keychain)])
              print('Apple accepted the notarization account, team and app-specific password. No artifact submitted.')
          finally:
              subprocess.run(['security','delete-keychain',str(keychain)],capture_output=True)
          PY
