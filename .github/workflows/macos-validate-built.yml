name: Validate preserved macOS build
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Completed universal build with successful compilation and preserved bundles
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require trusted compilation on main
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          assert os.environ['BUILD_RUN'].isdigit()
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['BUILD_RUN']
          run=json.loads(subprocess.check_output(['gh','api',endpoint]))
          assert run['path']=='.github/workflows/macos.yml' and run['head_branch']=='main' and run['status']=='completed'
          jobs=json.loads(subprocess.check_output(['gh','api',endpoint+'/jobs']))['jobs']
          assert any(s['name']=='Build VST3, Audio Units and native checks' and s['conclusion']=='success' for j in jobs for s in j['steps'])
          native_paths=['CMakeLists.txt','Products.cmake','Source','Tests','Assets','catalogue.json']
          subprocess.run(['git','fetch','--depth=1','origin',run['head_sha']],check=True)
          subprocess.run(['git','diff','--exit-code',run['head_sha'],'HEAD','--',*native_paths],check=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: mac-unvalidated-build
          path: build
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Restore bundle permissions and verify signatures
        run: |
          find build -type f -path '*/Contents/MacOS/*' -exec chmod +x '{}' +
          chmod +x build/hg_dsp_tests build/hg_plugin_tests_artefacts/Release/hg_plugin_tests build/hg_processor_tests_artefacts/Release/hg_processor_tests build/hg_license_tests_artefacts/Release/hg_license_tests
          find build -name '*.vst3' -o -name '*.component' | while IFS= read -r bundle; do codesign --verify --strict "$bundle"; done
      - name: Native Intel checks
        run: |
          ./build/hg_dsp_tests
          ./build/hg_plugin_tests_artefacts/Release/hg_plugin_tests
          ./build/hg_processor_tests_artefacts/Release/hg_processor_tests
          ./build/hg_license_tests_artefacts/Release/hg_license_tests Tests/Fixtures/entitlements.json licence-test-cache
      - name: Install pinned validator
        run: |
          curl --fail --location https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip --output pluginval.zip
          ditto -x -k pluginval.zip validator
      - name: Validate all universal bundles on Intel
        run: python3 scripts/macos/validate.py --build build --validator validator/pluginval.app/Contents/MacOS/pluginval --output mac-validation --workers 2 --system-au-install
      - name: Stage exact validated plugins
        run: python3 scripts/macos/stage.py --validation mac-validation/results.json --output mac-stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-intel-validation
          path: mac-validation
      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal-stage
          path: mac-stage
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: mac-native-checks
          path: |
            build/hg_dsp_tests
            build/hg_plugin_tests_artefacts/Release/hg_plugin_tests
            build/hg_processor_tests_artefacts/Release/hg_processor_tests
            build/hg_license_tests_artefacts/Release/hg_license_tests
  silicon:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-universal-stage
          path: mac-stage
      - uses: actions/download-artifact@v4
        with:
          name: mac-native-checks
          path: mac-checks
      - name: Restore executable permissions and native signatures
        run: |
          find mac-stage -type f -path '*/Contents/MacOS/*' -exec chmod +x '{}' +
          find mac-checks -type f -exec chmod +x '{}' +
          find mac-stage -name '*.vst3' -o -name '*.component' | while IFS= read -r bundle; do codesign --verify --strict "$bundle"; done
      - name: Native Apple Silicon checks
        run: |
          ./mac-checks/hg_dsp_tests
          ./mac-checks/hg_plugin_tests_artefacts/Release/hg_plugin_tests
          ./mac-checks/hg_processor_tests_artefacts/Release/hg_processor_tests
          ./mac-checks/hg_license_tests_artefacts/Release/hg_license_tests Tests/Fixtures/entitlements.json licence-test-cache
      - name: Install pinned validator
        run: |
          curl --fail --location https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip --output pluginval.zip
          ditto -x -k pluginval.zip validator
      - name: Validate exact universal bundles on Apple Silicon
        run: python3 scripts/macos/validate.py --stage mac-stage --validator validator/pluginval.app/Contents/MacOS/pluginval --output mac-validation --workers 2 --system-au-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-silicon-validation
          path: mac-validation
