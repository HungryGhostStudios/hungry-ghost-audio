name: Check Apple signing identities
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import encrypted signing identities
        env:
          MACOS_APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: python3 scripts/macos/sign.py --import-only --stage unused-stage --keychain "$RUNNER_TEMP/hungryghost.keychain-db" --scratch "$RUNNER_TEMP/certificates"
      - name: Sign and verify disposable application and installer fixtures
        env:
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          mkdir -p signing-check/payload
          cp /usr/bin/true signing-check/payload/signing-probe
          codesign --force --sign "$MACOS_APPLICATION_IDENTITY" --keychain "$RUNNER_TEMP/hungryghost.keychain-db" --timestamp --options runtime signing-check/payload/signing-probe
          codesign --verify --strict signing-check/payload/signing-probe
          pkgbuild --root signing-check/payload --identifier audio.hungryghost.signing-probe --version 1.0 --install-location /tmp/hungryghost-signing-probe signing-check/payload.pkg
          productbuild --package signing-check/payload.pkg --sign "$MACOS_INSTALLER_IDENTITY" --timestamp signing-check/signed-probe.pkg
          python3 - <<'PY'
          import os, subprocess
          signature=subprocess.run(['codesign','-d','--verbose=4','signing-check/payload/signing-probe'],capture_output=True,text=True,check=True).stderr
          assert os.environ['MACOS_APPLICATION_IDENTITY'] in signature
          assert 'TeamIdentifier='+os.environ['MACOS_TEAM_ID'] in signature and 'runtime' in signature
          package=subprocess.check_output(['pkgutil','--check-signature','signing-check/signed-probe.pkg'],text=True)
          assert os.environ['MACOS_INSTALLER_IDENTITY'] in package
          print('Both private-key identities signed and verified on a disposable Mac. No fixture was installed or published.')
          PY
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/hungryghost.keychain-db" || true
